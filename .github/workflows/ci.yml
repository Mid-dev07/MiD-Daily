name: MiD-Daily CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mid-daily-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run qa:static
      - name: Check frontend asset budget
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, readdirSync, statSync } from 'node:fs'
          import { gzipSync } from 'node:zlib'

          const assetDir = 'dist/assets'
          const files = readdirSync(assetDir)
          const js = files.filter((name) => name.endsWith('.js'))
          const css = files.filter((name) => name.endsWith('.css'))
          const largestJsBytes = Math.max(0, ...js.map((name) => statSync(`${assetDir}/${name}`).size))
          const largestJsGzip = Math.max(0, ...js.map((name) => gzipSync(readFileSync(`${assetDir}/${name}`)).length))
          const totalCssGzip = css.reduce((sum, name) => sum + gzipSync(readFileSync(`${assetDir}/${name}`)).length, 0)

          console.log(`Largest JS: ${largestJsGzip} bytes gzip (${largestJsBytes} bytes raw)`)
          console.log(`Total CSS: ${totalCssGzip} bytes gzip`)

          // Performance budget during the 2026 UI/UX upgrade:
          // JS: 192 KiB gzip gives ~34% headroom over the current 143.4 KiB build.
          // CSS: 22 KiB gzip gives ~28% headroom over the current 17.2 KiB build.
          // Keep these finite so the budget remains a regression guard, not a blank cheque.
          const MAX_JS_GZIP = 192 * 1024
          const MAX_CSS_GZIP = 22 * 1024

          if (largestJsGzip > MAX_JS_GZIP) process.exit(1)
          if (totalCssGzip > MAX_CSS_GZIP) process.exit(1)
          NODE

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler deploy --dry-run
