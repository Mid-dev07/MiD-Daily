name: MiD-Daily CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mid-daily-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Check frontend asset budget
        run: |
          node --input-type=module - <<'NODE'
          import { readdirSync, statSync } from 'node:fs'
          import { gzipSync } from 'node:zlib'

          const assetDir = 'dist/assets'
          const files = readdirSync(assetDir)
          const js = files.filter((name) => name.endsWith('.js'))
          const css = files.filter((name) => name.endsWith('.css'))
          const largestJs = Math.max(0, ...js.map((name) => statSync(`${assetDir}/${name}`).size))
          const cssGzip = gzipSync(css.flatMap((name) => []).toString()).length

          const largestJsBytes = largestJs
          const largestJsGzip = Math.max(0, ...js.map((name) => gzipSync(require('node:fs').readFileSync(`${assetDir}/${name}`)).length))
          const totalCssGzip = css.reduce((sum, name) => sum + gzipSync(require('node:fs').readFileSync(`${assetDir}/${name}`)).length, 0)

          console.log(`Largest JS: ${largestJsGzip} bytes gzip (${largestJsBytes} bytes raw)`)
          console.log(`Total CSS: ${totalCssGzip} bytes gzip`)

          if (largestJsGzip > 160 * 1024) process.exit(1)
          if (totalCssGzip > 18 * 1024) process.exit(1)
          NODE

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx wrangler deploy --dry-run
