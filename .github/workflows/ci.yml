name: MiD-Daily CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mid-daily-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run qa:static
      - name: Check frontend asset budget
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, readdirSync, statSync } from 'node:fs'
          import { gzipSync } from 'node:zlib'

          const assetDir = 'dist/assets'
          const files = readdirSync(assetDir)
          const js = files.filter((name) => name.endsWith('.js'))
          const css = files.filter((name) => name.endsWith('.css'))
          const media = files.filter((name) => /\.(avif|webp|png|jpe?g|svg|woff2?|ttf|otf)$/i.test(name))
          const largestJsBytes = Math.max(0, ...js.map((name) => statSync(`${assetDir}/${name}`).size))
          const largestJsGzip = Math.max(0, ...js.map((name) => gzipSync(readFileSync(`${assetDir}/${name}`)).length))
          const totalCssGzip = css.reduce((sum, name) => sum + gzipSync(readFileSync(`${assetDir}/${name}`)).length, 0)
          const totalAssetBytes = files.reduce((sum, name) => sum + statSync(`${assetDir}/${name}`).size, 0)
          const totalMediaBytes = media.reduce((sum, name) => sum + statSync(`${assetDir}/${name}`).size, 0)

          console.log(`Largest JS: ${largestJsGzip} bytes gzip (${largestJsBytes} bytes raw)`)
          console.log(`Total CSS: ${totalCssGzip} bytes gzip`)
          console.log(`Total asset bytes: ${totalAssetBytes}`)
          console.log(`Media/font asset bytes: ${totalMediaBytes}`)

          // Intentional headroom for high-fidelity UI without permitting uncontrolled payload growth.
          // Baseline remains around 143 KiB largest JS gzip / 17 KiB total CSS gzip.
          const WARN_JS_GZIP = 280 * 1024
          const WARN_CSS_GZIP = 40 * 1024
          const MAX_JS_GZIP = 320 * 1024
          const MAX_CSS_GZIP = 48 * 1024
          const WARN_TOTAL_ASSETS = 1_536 * 1024
          const MAX_TOTAL_ASSETS = 2_048 * 1024
          const WARN_MEDIA_ASSETS = 1_024 * 1024
          const MAX_MEDIA_ASSETS = 1_280 * 1024

          if (largestJsGzip > WARN_JS_GZIP) console.warn('Largest JS is above the 280 KiB warning budget.')
          if (totalCssGzip > WARN_CSS_GZIP) console.warn('Total CSS is above the 40 KiB warning budget.')
          if (totalAssetBytes > WARN_TOTAL_ASSETS) console.warn('Total frontend assets are above the 1.5 MiB warning budget.')
          if (totalMediaBytes > WARN_MEDIA_ASSETS) console.warn('Image/font assets are above the 1 MiB warning budget.')

          if (largestJsGzip > MAX_JS_GZIP) process.exit(1)
          if (totalCssGzip > MAX_CSS_GZIP) process.exit(1)
          if (totalAssetBytes > MAX_TOTAL_ASSETS) process.exit(1)
          if (totalMediaBytes > MAX_MEDIA_ASSETS) process.exit(1)
          NODE

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler deploy --dry-run
