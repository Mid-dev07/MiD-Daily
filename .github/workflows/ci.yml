name: MiD-Daily CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mid-daily-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run qa:static
      - name: Check frontend asset budget
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, readdirSync, statSync } from 'node:fs'
          import { gzipSync } from 'node:zlib'

          const assetDir = 'dist/assets'
          const files = readdirSync(assetDir)
          const js = files.filter((name) => name.endsWith('.js'))
          const css = files.filter((name) => name.endsWith('.css'))
          const largestJsBytes = Math.max(0, ...js.map((name) => statSync(`${assetDir}/${name}`).size))
          const largestJsGzip = Math.max(0, ...js.map((name) => gzipSync(readFileSync(`${assetDir}/${name}`)).length))
          const totalCssGzip = css.reduce((sum, name) => sum + gzipSync(readFileSync(`${assetDir}/${name}`)).length, 0)

          console.log(`Largest JS: ${largestJsGzip} bytes gzip (${largestJsBytes} bytes raw)`)
          console.log(`Total CSS: ${totalCssGzip} bytes gzip`)

          // High-fidelity UI/UX development budget for the 2026 visual upgrade.
          // Warning zone keeps us aware of drift before the hard gate is reached.
          // Hard limits are intentionally finite so visual ambition cannot turn into unchecked bloat.
          // Current baseline: ~143.4 KiB largest JS gzip / ~17.2 KiB total CSS gzip.
          const WARN_JS_GZIP = 224 * 1024
          const WARN_CSS_GZIP = 28 * 1024
          const MAX_JS_GZIP = 256 * 1024
          const MAX_CSS_GZIP = 32 * 1024

          if (largestJsGzip > WARN_JS_GZIP) {
            console.warn('Largest JS is above the 224 KiB warning budget.')
          }
          if (totalCssGzip > WARN_CSS_GZIP) {
            console.warn('Total CSS is above the 28 KiB warning budget.')
          }

          if (largestJsGzip > MAX_JS_GZIP) process.exit(1)
          if (totalCssGzip > MAX_CSS_GZIP) process.exit(1)
          NODE

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler deploy --dry-run
