name: Deploy MiD-Daily to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mid-daily-production-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.mid-manager.xyz
          VITE_SUPABASE_URL: https://ywpvwxhfzgxwmxrwcfsf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_TIMEZONE: Asia/Jakarta
        run: npm run build

      - name: Static frontend QA
        run: npm run qa:static

      - name: Deploy frontend Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy

      - name: Smoke test frontend
        working-directory: .
        run: |
          set -euo pipefail
          base=https://mid-manager.xyz
          html=$(curl --fail --silent --show-error --location "$base/")
          printf '%s' "$html" | grep -Eq '<title>MiD-Daily</title>|/assets/'
          asset=$(printf '%s' "$html" | grep -oE 'src="/assets/[^"]+\.js"' | head -n 1 | cut -d'"' -f2)
          test -n "$asset"
          curl --fail --silent --show-error --location "$base$asset" -o /tmp/mid-daily-app.js
          test -s /tmp/mid-daily-app.js
          manifest=$(curl --fail --silent --show-error --location "$base/manifest.webmanifest")
          printf '%s' "$manifest" | grep -q '"name": "MiD-Daily"'
          curl --fail --silent --show-error --location "$base/icon.svg" -o /tmp/mid-daily-icon.svg
          test -s /tmp/mid-daily-icon.svg
          echo "Frontend smoke test passed."

  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy backend Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

      - name: Verify backend secrets
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > /tmp/mid-daily-secrets.json
          node -e 'const fs=require("fs"); const names=JSON.parse(fs.readFileSync("/tmp/mid-daily-secrets.json","utf8")).map(x=>x.name); for (const name of ["SUPABASE_SECRET_KEY","TOKEN_ENCRYPTION_KEY_B64"]) if (!names.includes(name)) { console.error("Missing required Worker secret:", name); process.exit(1) }'
          echo "Core backend secrets are present."
          echo "Configured provider secret names (values never printed):"
          node -e 'const fs=require("fs"); const names=JSON.parse(fs.readFileSync("/tmp/mid-daily-secrets.json","utf8")).map(x=>x.name); const providers={googleCalendar:["GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET"],telegram:["TELEGRAM_BOT_TOKEN","TELEGRAM_BOT_USERNAME","TELEGRAM_WEBHOOK_SECRET","TELEGRAM_WEBHOOK_URL"],whatsapp:["WHATSAPP_ACCESS_TOKEN","WHATSAPP_PHONE_NUMBER_ID","WHATSAPP_GRAPH_VERSION","WHATSAPP_APP_SECRET","WHATSAPP_VERIFY_TOKEN","WHATSAPP_BUSINESS_PHONE_NUMBER"],instagram:["INSTAGRAM_ACCESS_TOKEN","INSTAGRAM_GRAPH_VERSION","INSTAGRAM_ACCOUNT_ID","INSTAGRAM_CLIENT_ID","INSTAGRAM_CLIENT_SECRET"]}; for (const [provider,required] of Object.entries(providers)) console.log(provider, JSON.stringify({configured:required.every(name=>names.includes(name)),present:required.filter(name=>names.includes(name)),missing:required.filter(name=>!names.includes(name))}))'

      - name: Smoke test backend
        working-directory: . 
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --location --write-out '\n__HTTP_STATUS__%{http_code}' https://api.mid-manager.xyz/health)
          status=$(printf '%s\n' "$response" | tail -n 1)
          body=$(printf '%s\n' "$response" | sed '$d')
          status="${status#__HTTP_STATUS__}"
          echo "Backend health response (HTTP $status):"
          printf '%s\n' "$body"
          test "$status" = "200"
          RESPONSE="$body" node -e 'const data=JSON.parse(process.env.RESPONSE); if (!data.ok || !data.authConfigured || !data.dataPersistenceConfigured || data.integrations?.ai !== true) process.exit(1); console.log("Integration readiness:", JSON.stringify(data.integrations ?? {}))'
          password_check=$(curl --fail --silent --show-error --location \
            https://api.mid-manager.xyz/api/security/password-range/5BAA6)
          PASSWORD_CHECK="$password_check" node -e 'const data=JSON.parse(process.env.PASSWORD_CHECK); if (!data.ok || typeof data.suffixes !== "string" || !data.suffixes.includes("1E4C9B93F3F0682250B6CF8331B7EE68FD8:")) process.exit(1); console.log("Password exposure proxy smoke test passed.")'
          protected=$(curl --silent --show-error --location --write-out '%{http_code}' --output /tmp/mid-daily-protected.json https://api.mid-manager.xyz/api/workspace/bootstrap)
          test "$protected" = "401"
          echo "Unauthenticated workspace API correctly rejected with HTTP 401."
          echo "Backend smoke test passed."
