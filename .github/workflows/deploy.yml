name: Deploy MiD-Daily to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mid-daily-production-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://mid-daily-api.e41262272.workers.dev
          VITE_SUPABASE_URL: https://ywpvwxhfzgxwmxrwcfsf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy frontend Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy

      - name: Smoke test frontend
        working-directory: .
        run: |
          set -euo pipefail
          html=$(curl --fail --silent --show-error --location https://mid-daily.e41262272.workers.dev/)
          asset=$(printf '%s' "$html" | grep -oE 'src="/assets/[^"]+\.js"' | head -n 1 | cut -d'"' -f2)
          test -n "$asset"
          curl --fail --silent --show-error --location "https://mid-daily.e41262272.workers.dev$asset" | grep -q 'ywpvwxhfzgxwmxrwcfsf'
          echo "Frontend smoke test passed."

  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm install

      - name: Deploy backend Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

      - name: Smoke test backend
        working-directory: .
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --location https://mid-daily-api.e41262272.workers.dev/health)
          echo "$response"
          RESPONSE="$response" node -e 'const data=JSON.parse(process.env.RESPONSE); if (!data.ok || !data.authConfigured || !data.dataPersistenceConfigured) process.exit(1)'
          echo "Backend smoke test passed."
