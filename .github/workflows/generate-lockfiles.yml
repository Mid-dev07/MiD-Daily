name: Generate dependency lockfiles

on:
  push:
    branches:
      - fix/release-hardening-2026-09-22

permissions:
  contents: write

jobs:
  lockfiles:
    if: "!contains(github.event.head_commit.message, '[skip lockfile bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfiles and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json backend/package-lock.json
          git rm .github/workflows/generate-lockfiles.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deps): add reproducible npm lockfiles [skip lockfile bot]"
          git push
